<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Japan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

</head>
<body>

    <header class="bg-white sticky-top shadow-sm">
        <div class="container">
            <nav class="navbar navbar-expand-lg navbar-light p-0">
                <div class="container-fluid px-0">
                    <a class="navbar-brand" href="#">
                        <img src="https://www.japan.travel/assets/images/logo/logo.svg" alt="Japan Travel Logo" class="img-fluid">
                    </a>
                    
                    <button class="navbar-toggler ms-auto border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
        
                    <div class="collapse navbar-collapse" id="navbarNav">
                        <ul class="navbar-nav mx-auto">
                            <li class="nav-item">
                                <a class="nav-link text-dark px-3 py-3 py-lg-2" href="#">Destinations</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link text-dark px-3 py-3 py-lg-2" href="#">Things to Do</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link text-dark px-3 py-3 py-lg-2" href="#">Plan Your Trip</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link text-dark px-3 py-3 py-lg-2" href="#">Inspiration</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link text-dark px-3 py-3 py-lg-2" href="#">Contact Us</a>
                            </li>
                        </ul>
                        
                        <form class="d-flex ms-lg-3 my-2 my-lg-0">
                            <div class="input-group">
                                <input class="form-control border-end-0" type="search" placeholder="Search..." aria-label="Search">
                                <button class="btn btn-outline-secondary border-start-0" type="submit">
                                    <i class="bi bi-search"></i>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </nav>
        </div>
    </header>
    

    <div class="container-fluid px-0">
        <div style="height: 80vh">
            <div id="carouselindicators" class="carousel slide h-100" data-bs-ride="carousel">
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#carouselindicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselindicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
                    <button type="button" data-bs-target="#carouselindicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
                </div>
    
                <div class="carousel-inner h-100">
                    <div class="carousel-item active h-100">
                        <img src="Images/testimg.jpg" class="d-block w-100 h-100 object-fit-cover" alt="Japan Image 1">
                        <div class="carousel-caption d-flex flex-column justify-content-center h-100 pb-3 pb-md-5">
                            <h1 class="text-white fw-bold display-5 display-md-3 display-lg-1">Traditional Meets Modern</h1>
                            <p class="fs-5 fs-lg-4">Experience the blend of ancient traditions and cutting-edge technology</p>
                        </div>
                    </div>
                    <div class="carousel-item h-100">
                        <img src="Images/testimage1.jpg" class="d-block w-100 h-100 object-fit-cover" alt="Japan Image 2">
                        <div class="carousel-caption d-flex flex-column justify-content-center h-100 pb-3 pb-md-5">
                            <h1 class="text-white fw-bold display-5 display-md-3 display-lg-1">Discover the Beauty</h1>
                            <p class="d-none d-md-block fs-5 fs-lg-4">From cherry blossoms to majestic mountains</p>
                        </div>
                    </div>
                    <div class="carousel-item h-100">
                        <img src="Images/testimage2.jpg" class="d-block w-100 h-100 object-fit-cover" alt="Japan Image 3">
                        <div class="carousel-caption d-flex flex-column justify-content-center h-100 pb-3 pb-md-5">
                            <h1 class="text-white fw-bold display-5 display-md-3 display-lg-1">Explore Japan</h1>
                            <p class="d-none d-md-block fs-5 fs-lg-4">Your unforgettable journey starts here</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
      
      

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
</body>
</html>
